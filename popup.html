<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyPLU AutoFill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 300px;
      background: #0f172a;
      color: #e2e8f0;
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 22px; }
    .header-title { font-size: 14px; font-weight: 700; letter-spacing: 0.3px; }
    .header-sub { font-size: 10px; opacity: 0.75; margin-top: 2px; }

    .body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Status card ── */
    .status-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid #334155;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 20px;
    }
    .badge-empty    { background: #334155; color: #94a3b8; }
    .badge-loading  { background: #78350f; color: #fcd34d; }
    .badge-ready    { background: #14532d; color: #86efac; }
    .badge-error    { background: #7f1d1d; color: #fca5a5; }
    .badge-stopped  { background: #44403c; color: #d6d3d1; }

    .count-row {
      margin-top: 8px;
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1;
    }
    .count-label { font-size: 10px; color: #64748b; margin-top: 2px; }

    .expected-row {
      margin-top: 6px;
      font-size: 11px;
      color: #64748b;
      display: none;
    }
    .expected-row.visible { display: block; }
    .expected-ok   { color: #86efac; }
    .expected-warn { color: #fcd34d; }

    /* ── Progress bar ── */
    .progress-wrap {
      display: none;
      margin-top: 8px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-wrap.visible { display: block; }
    .progress-bar-fill {
      height: 100%;
      background: #f59e0b;
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }

    /* ── Autofill status ── */
    .autofill-status {
      background: #1e293b;
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid #334155;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-green { background: #22c55e; }
    .dot-amber { background: #f59e0b; animation: pulse 1s infinite; }
    .dot-gray  { background: #475569; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

    /* ── Current query indicator ── */
    .query-indicator {
      display: none;
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
    }
    .query-indicator.visible { display: block; }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 9px 6px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover  { opacity: 0.85; }
    .btn:active { opacity: 0.70; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-stop    { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    .btn-danger  { background: #1e293b; color: #f87171; border: 1px solid #334155; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Toggles ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border-radius: 8px;
      padding: 9px 12px;
      border: 1px solid #334155;
    }
    .toggle-label { font-size: 11px; color: #94a3b8; }
    .toggle {
      position: relative;
      width: 34px;
      height: 18px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #334155;
      border-radius: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider:before {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #3b82f6; }
    .toggle input:checked + .toggle-slider:before { transform: translateX(16px); }

    /* ── Debug panel ── */
    .debug-panel {
      display: none;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 10px;
      font-family: monospace;
      color: #94a3b8;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
    }
    .debug-panel.visible { display: block; }
    .debug-line { margin-bottom: 1px; }
    .debug-line.ok   { color: #86efac; }
    .debug-line.warn { color: #fcd34d; }
    .debug-line.err  { color: #fca5a5; }

    .info {
      font-size: 10px;
      color: #475569;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🏷️</div>
    <div>
      <div class="header-title">EasyPLU AutoFill</div>
      <div class="header-sub">Automatic PLU code assistant</div>
    </div>
  </div>

  <div class="body">

    <!-- Status card -->
    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Database</span>
        <span class="status-badge badge-empty" id="statusBadge">Empty</span>
      </div>
      <div class="count-row" id="countDisplay">0</div>
      <div class="count-label">products stored</div>
      <div class="expected-row" id="expectedRow"></div>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="query-indicator" id="queryIndicator"></div>
    </div>

    <!-- AutoFill status -->
    <div class="autofill-status" id="autofillStatus">
      <div class="dot dot-gray" id="autofillDot"></div>
      <span id="autofillText">AutoFill inactive — not on a test page</span>
    </div>

    <!-- Main buttons -->
    <div class="btn-row">
      <button class="btn btn-primary" id="rescrapeBtn">🔄 Re-scrape</button>
      <button class="btn btn-stop"    id="stopBtn" disabled>⏹ Stop</button>
      <button class="btn btn-danger"  id="clearBtn">🗑️ Clear</button>
    </div>

    <!-- Debug toggle -->
    <div class="toggle-row">
      <span class="toggle-label">🐛 Debug mode</span>
      <label class="toggle">
        <input type="checkbox" id="debugToggle" />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Debug panel (only visible when debug is on) -->
    <div class="debug-panel" id="debugPanel"></div>

    <div class="info">
      Open the EasyPLU search page to auto-scrape.<br>
      AutoFill activates automatically on test pages.
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
